<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1090px" height="520px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #953800;}
.value {fill: #0a3069;}
.cc {fill: #c2cfde;}
text, tspan {white-space: pre;}

.blinkA {animation: blinkA 4s infinite;}
.blinkB {animation: blinkB 4s infinite;}
@keyframes blinkA {0%,92%,100% {opacity:1;} 94%,98% {opacity:0;}}
@keyframes blinkB {0%,92%,100% {opacity:0;} 94%,98% {opacity:1;}}
.tapA {animation: tap .5s steps(1) infinite;}
.tapB {animation: tap .5s steps(1) infinite; animation-delay: -.25s;}
@keyframes tap {0% {opacity:1;} 50% {opacity:0;}}
.pulse {animation: pulse 2s ease-in-out infinite;}
@keyframes pulse {0%,100% {opacity:.35;} 50% {opacity:1;}}
.press {opacity:0; animation: press 1.6s infinite;}
@keyframes press {0%,100% {opacity:0;} 8%,22% {opacity:1;} 30% {opacity:0;}}

</style>
